global:
  scrape_interval: 15s
rule_files:
  - /opt/lina/apps/server/deploy/alerts.yaml
scrape_configs:
  - job_name: lina-account
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /opt/lina/apps/server/data/secrets/metrics-token
    static_configs:
      - targets: ['127.0.0.1:3002']
# Run the collector on the VM host, or adapt the target/paths to its container.
# Configure Alertmanager or Google Managed Service for Prometheus notifications
# with the user's chosen destination. This file does not create a live alert channel.
