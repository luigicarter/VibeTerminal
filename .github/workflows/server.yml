name: Account server checks
on:
  push:
    paths: ['apps/server/**', 'scripts/run-app.cjs', 'scripts/monorepo.test.cjs', '.github/workflows/server.yml']
  pull_request:
    paths: ['apps/server/**', 'scripts/run-app.cjs', 'scripts/monorepo.test.cjs', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/server/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run contracts && git diff --exit-code -- contracts/openapi.json
      - run: bun run contracts:prepared && git diff --exit-code -- contracts/prepared/openapi.json
      - run: bun run format:check
      - run: bun run test:container
      - run: docker run --rm --mount "type=bind,source=$PWD/deploy,target=/rules,readonly" --mount "type=bind,source=$PWD/tests/alerts.test.yaml,target=/tests.yaml,readonly" --entrypoint promtool prom/prometheus:v3.5.0 test rules /tests.yaml
      - run: docker build -f deploy/Dockerfile -t lina-account-server:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: lina-account-server
          path: |
            apps/server/dist
            apps/server/migrations
            apps/server/contracts
