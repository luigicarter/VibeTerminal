name: Website checks

on:
  push:
    paths:
      - 'apps/website/**'
      - 'packages/brand/**'
      - 'scripts/sync-brand.cjs'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'apps/website/**'
      - 'packages/brand/**'
      - 'scripts/sync-brand.cjs'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: lina-website
          path: |
            apps/website/frontend/dist
            apps/website/backend/dist
