name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Electron runtime for UI tests
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw "Electron test runtime preparation failed." }
          $expected = node -p "require('./node_modules/electron/package.json').version"
          $actual = (Get-Content -LiteralPath "node_modules/electron/dist/version" -Raw).Trim().TrimStart("v")
          if ($actual -ne $expected -or -not (Test-Path -LiteralPath "node_modules/electron/dist/electron.exe")) {
            throw "Electron test runtime does not match the installed package."
          }

      - name: Prepare embedded Codex binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versions = @(Get-ChildItem -LiteralPath "vendor/codex-appserver" -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' })
          if ($versions.Count -ne 1) {
            throw "Expected exactly one vendored Codex app-server version, found $($versions.Count)."
          }
          $version = $versions[0].Name
          npm install -g "@openai/codex@$version"
          if ($LASTEXITCODE -ne 0) { throw "Codex installation failed." }
          npm run prepare:codex-bin:required
          if ($LASTEXITCODE -ne 0) { throw "Codex preparation failed." }

      - name: Build renderer for release checks
        run: npm run build

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
          }

      - name: Verify bundled voice audio and models
        run: npm run prepare:voice

      - name: Run release checks
        run: node scripts/qa/release-checks.cjs

      - name: Build Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify embedded Codex was packaged
        shell: pwsh
        run: |
          $required = @(
            "release/win-unpacked/resources/codex-bin/win32-x64/codex.exe",
            "release/win-unpacked/resources/codex-bin/win32-x64/codex-code-mode-host.exe",
            "release/win-unpacked/resources/codex-bin/win32-x64/codex-package.json",
            "release/win-unpacked/resources/codex-bin/win32-x64/codex-path/rg.exe",
            "release/win-unpacked/resources/codex-bin/win32-x64/codex-resources/codex-command-runner.exe",
            "release/win-unpacked/resources/codex-bin/win32-x64/codex-resources/codex-windows-sandbox-setup.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing packaged embedded Codex payload file: $file"
            }
          }

      - name: Verify update feed and voice payload
        run: node scripts/qa/verify-release-artifacts.cjs

      - name: Exercise packaged voice inference before publication
        run: node scripts/qa/voice-packaged-smoke.cjs

      - name: Exercise packaged workspace and task interfaces
        run: node scripts/qa/orchestrator-smoke.cjs --packaged --hidden

      - name: Exercise queued task interface
        run: npm run smoke:electron:orchestrator-tasks

      - name: Exercise microphone capture and voice workflow
        run: npm run smoke:electron:voice-experience

      - name: Exercise history and context without voice activation
        run: npm run smoke:electron:context-history

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $version = $tag.TrimStart("v")
          $files = @(
            "release/LinaTerminal-Setup-$version.exe",
            "release/LinaTerminal-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )

          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release asset: $file"
            }
          }

          if (gh release view $tag --repo $repo *> $null) {
            gh release upload $tag @files --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          } else {
            $notes = "docs/releases/$version.md"
            if (Test-Path -LiteralPath $notes) {
              gh release create $tag @files --repo $repo --title $version --latest --notes-file $notes
            } else {
              gh release create $tag @files --repo $repo --title $version --latest --generate-notes
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: LinaTerminal-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Upload UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-ui-failure-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .tmp/voice-experience-smoke/**/results.json
            .tmp/voice-experience-smoke/**/electron.log
            .tmp/voice-experience-smoke/**/events.jsonl
            .tmp/voice-experience-smoke/**/*.png
            .tmp/context-history-smoke/**/results.json
            .tmp/context-history-smoke/**/electron.log
            .tmp/context-history-smoke/**/*.png
            .tmp/orchestrator-task-ui-smoke/**/results.json
            .tmp/orchestrator-task-ui-smoke/**/electron.log
            .tmp/orchestrator-task-ui-smoke/**/*.png
            .tmp/orchestrator-smoke/**/results.json
            .tmp/orchestrator-smoke/**/electron.log
